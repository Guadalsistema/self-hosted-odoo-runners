name: Build Docker image

on:
  push:
    branches: [ "self-hosted-python" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - name: Build image
        run: docker build -t python-runner:self-hosted-python .
      - name: Verify Python runner image
        run: |
          set -eu
          image=python-runner:self-hosted-python
          docker run --rm --entrypoint /bin/sh "$image" -c '
            set -eu
            test "$(id -un)" = runner
            python --version | grep -E "^Python 3\\.14(\\.|$)"
            pip --version
            python -m venv /tmp/runner-test-venv
            test -x /tmp/runner-test-venv/bin/python
            /tmp/runner-test-venv/bin/python -m pip install "grpcio>=1.83"
            make --version
          '
          runner_version=2.336.0
          docker run --rm --entrypoint /bin/sh \
            -e RUNNER_VERSION="$runner_version" "$image" -c '
            set -eu
            tmp=$(mktemp -d)
            trap "rm -rf \"$tmp\"" EXIT
            curl -fsSL -o "$tmp/runner.tgz" \
              "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
            mkdir "$tmp/runner"
            tar -xzf "$tmp/runner.tgz" -C "$tmp/runner"
            cd "$tmp/runner"
            ./bin/Runner.Listener --version
          '
          docker run --rm "$image" --help
